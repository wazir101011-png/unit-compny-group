<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="./config.js"></script>
<script src="./common.js"></script>
<script src="./seed_dryfruit_lahore.js"></script>
<script src="./seed_branches_import.js"></script>
<script src="./seed_account_283.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unit Business Group">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080808">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            direction: rtl;
            background-color: #0d0d0d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
            position: relative;
        }

        .theme-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4af37;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: all 0.25s ease;
            z-index: 1000;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.08);
            border-color: #d4af37;
        }

        .login-container {
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.25s ease;
        }

        .company-logo { width: 150px; height: auto; margin-bottom: 15px; object-fit: contain; }

        .login-title {
            font-size: clamp(24px, 3.5vw, 32px);
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .login-subtitle {
            font-size: clamp(14px, 2vw, 17px);
            color: #f3e5ab;
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-weight: bold;
        }
        .input-group { margin-bottom: 18px; text-align: right; }
        .input-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; outline: none; text-align: center; transition: all 0.2s ease; }
        .input-group input:focus { border-color: #d4af37; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            border: none;
            border-radius: 6px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #f5d77f 0%, #c59b27 100%);
            color: #000;
        }
        .btn-login:active { transform: scale(0.98); }
        .error-message { color: #ff6b6b; font-size: 14px; margin-top: 12px; display: none; font-weight: bold; }

        body.light-theme {
            background-color: #f3f4f6;
            color: #111827;
        }
        body.light-theme .theme-toggle-btn {
            background: #ffffff;
            border-color: #d1d5db;
            color: #aa7c11;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body.light-theme .login-container {
            background: #ffffff;
            border-color: #e5e7eb;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        body.light-theme .login-title {
            color: #aa7c11;
        }
        body.light-theme .login-subtitle {
            color: #8c6407;
        }
        body.light-theme .input-group label {
            color: #374151;
        }
        body.light-theme .input-group input {
            background: #f9fafb;
            border-color: #d1d5db;
            color: #111827;
        }
        body.light-theme .input-group input:focus {
            border-color: #aa7c11;
            box-shadow: 0 0 0 3px rgba(170, 124, 17, 0.15);
        }
        body.light-theme .btn-login {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #ffffff;
        }
        body.light-theme .btn-login:hover {
            background: linear-gradient(135deg, #aa7c11 0%, #8c6407 100%);
            color: #ffffff;
        }
    </style>
    <style id="neuLogin">
        body { --bg:#e9edf3; --hi:#ffffff; --lo:#c5ccd8; --ink:#1f2937; --mut:#6b7280; --acc:#0a84ff; --acc2:#00b4ff;
               background: var(--bg); color: var(--ink); font-family: Poppins, 'Segoe UI', Tahoma, Arial, sans-serif; overflow-x: hidden; }
        body:not(.light-theme) { --bg:#23272f; --hi:#2d323c; --lo:#191c22; --ink:#f3f4f6; --mut:#9aa3b2; background: var(--bg); color: var(--ink); }
        body::before, body::after { content:''; position: fixed; border-radius: 50%; background: var(--bg); pointer-events: none; z-index: 0;
               box-shadow: 14px 14px 30px var(--lo), -14px -14px 30px var(--hi); }
        body::before { width: min(260px,40vw); height: min(260px,40vw); top: 4%; left: 3%; }
        body::after { width: min(220px,34vw); height: min(220px,34vw); bottom: 4%; right: 3%; }
        .login-container { position: relative; z-index: 1; background: var(--bg); border: none; border-radius: 34px; max-width: 390px; padding: 46px 30px 30px;
               box-shadow: 18px 18px 40px var(--lo), -18px -18px 40px var(--hi); }
        .company-logo { width: 140px; height: 140px; padding: 0; margin: -8px auto 16px; display: block; border-radius: 50%; background: transparent; object-fit: contain;
               box-shadow: 8px 8px 18px var(--lo), -8px -8px 18px var(--hi); }
        .login-title { color: var(--ink); text-shadow: none; font-weight: 800; letter-spacing: 1px; margin-bottom: 2px; }
        .login-subtitle { color: var(--mut); margin-bottom: 26px; font-weight: 600; letter-spacing: 6px; }
        .input-group label { color: var(--mut); font-size: 13px; font-weight: 600; padding: 0 6px; }
        .input-group input { background: var(--bg); border: none; border-radius: 16px; padding: 14px 16px; color: var(--ink);
               box-shadow: inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi); transition: box-shadow .2s; }
        .input-group input::placeholder { color: var(--mut); opacity: .8; }
        .input-group input:focus { border: none; box-shadow: inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi), 0 0 0 2px rgba(10,132,255,.45); }
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-inline-end: 46px; }
        .pw-eye { position: absolute; top: 50%; inset-inline-end: 14px; transform: translateY(-50%); background: none; border: 0; cursor: pointer; font-size: 18px; color: var(--mut); padding: 4px; line-height: 1; }
        .btn-login { background: linear-gradient(90deg, var(--acc) 0%, var(--acc2) 50%, var(--acc) 100%); color: #fff; border-radius: 18px; padding: 15px; font-size: 17px; letter-spacing: .5px;
               box-shadow: 0 10px 22px rgba(10,132,255,.38); margin-top: 14px; }
        .btn-login:hover { background: linear-gradient(90deg, #0070e0 0%, #00a2ee 50%, #0070e0 100%); color: #fff; transform: translateY(-1px); }
        .btn-login:active { transform: scale(.98); box-shadow: 0 4px 10px rgba(10,132,255,.35); }
        .error-message { color: #e5484d; }
        .theme-toggle-btn { background: var(--bg); border: none; color: var(--acc); z-index: 1000;
               box-shadow: 5px 5px 10px var(--lo), -5px -5px 10px var(--hi); }
        .theme-toggle-btn:hover { transform: none; }
        .theme-toggle-btn:active { box-shadow: inset 4px 4px 8px var(--lo), inset -4px -4px 8px var(--hi); }
        body.light-theme { background-color: var(--bg); color: var(--ink); }
        body.light-theme .login-container, body.light-theme .input-group input, body.light-theme .theme-toggle-btn { border: none; }
        body.light-theme .login-container { background: var(--bg); box-shadow: 18px 18px 40px var(--lo), -18px -18px 40px var(--hi); }
        body.light-theme .login-title { color: var(--ink); } body.light-theme .login-subtitle { color: var(--mut); } body.light-theme .input-group label { color: var(--mut); }
        body.light-theme .input-group input { background: var(--bg); color: var(--ink); box-shadow: inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi); }
        body.light-theme .input-group input:focus { box-shadow: inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi), 0 0 0 2px rgba(10,132,255,.45); }
        body.light-theme .btn-login { background: linear-gradient(90deg, var(--acc) 0%, var(--acc2) 50%, var(--acc) 100%); color: #fff; }
        body.light-theme .theme-toggle-btn { background: var(--bg); color: var(--acc); box-shadow: 5px 5px 10px var(--lo), -5px -5px 10px var(--hi); }
        @media (max-width: 420px) { .login-container { padding: 40px 20px 24px; border-radius: 28px; } }
            html, body { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    </style>
<link rel="stylesheet" href="./neu_ui.css">
<link rel="stylesheet" href="./print_fix.css">
</head>
<body>

    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تھیم تبدیل کریں">🌙</button>

    <div class="login-container">
        <img src="icon-512.png" alt="Unit Business Group Logo" class="company-logo">
        <div class="login-title">UNIT BUSINESS</div>
        <div class="login-subtitle">GROUP</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">یوزر نیم (User Name):</label>
                <input type="text" id="username" placeholder="یوزر نیم درج کریں" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">سیکیورٹی پاس ورڈ (Password):</label>
                <div class="pw-wrap"><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"><button type="button" class="pw-eye" id="pwEye" aria-label="show password" onclick="var i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈'">👁️</button></div>
            </div>

            <button type="submit" class="btn-login">سسٹم میں داخل ہوں</button>
            <div id="errorMsg" class="error-message">❌ یوزر نیم یا پاس ورڈ درست نہیں ہے!</div>
        </form>
    </div>

    <script>
        function applySavedTheme() {
            let savedTheme = App.store.get('rohan_theme_mode') || 'light';
            let themeMeta = document.querySelector('meta[name="theme-color"]');
            let toggleBtn = document.getElementById('themeToggleBtn');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (toggleBtn) toggleBtn.innerText = '☀️';
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (toggleBtn) toggleBtn.innerText = '🌙';
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }

        function toggleTheme() {
            let currentTheme = App.store.get('rohan_theme_mode') || 'light';
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            App.store.set('rohan_theme_mode', newTheme);
            applySavedTheme();
        }

        applySavedTheme();

        try { sessionStorage.clear(); } catch (e) {}
        var _failCount = 0, _lockUntil = 0;
        var _maxTries = parseInt(App.store.get('rohan_lock_attempts'), 10) || 5, _lockMs = (parseInt(App.store.get('rohan_lock_seconds'), 10) || 30) * 1000;

        var USERS = {
            'admin': { role: 'admin', salt: '741d08ddc5513f2ddaec41c655af277a', iter: 120000, hash: '66e8e662f825af7700c65b3f1f30b76fd98fe5c443273a336f76f9f62f2d571e' },
            'owner': { role: 'owner', salt: '8a9f5f75bbb7f2fb35a1e108a9fe2f6c', iter: 120000, hash: '8825eceebbe4730dd4d507db5d18eeeec1c0647347ba11875c6ed23282665f81' }
        };
        var _busy = false;
        function handleLogin(event) {
            event.preventDefault();
            if (_busy) return;
            const errorMsg = document.getElementById('errorMsg');
            if (Date.now() < _lockUntil) {
                const secs = Math.ceil((_lockUntil - Date.now()) / 1000);
                errorMsg.innerText = App.i18n.isEn() ? '⏳ Too many wrong attempts: try again in ' + secs + ' seconds' : '⏳ بار بار غلط کوشش: ' + secs + ' سیکنڈ بعد دوبارہ کوشش کریں';
                errorMsg.style.display = 'block';
                return;
            }
            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();
            const fail = function (res) {
                _failCount++;
                errorMsg.innerText = App.i18n.text(res && res.network ? '⚠️ سرور سے رابطہ نہیں ہوا / Server not reachable' : res && res.locked ? '⏳ بہت زیادہ کوششیں، کچھ دیر بعد کوشش کریں' : '❌ یوزر نیم یا پاس ورڈ درست نہیں ہے!');
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                if (_failCount >= _maxTries) { _lockUntil = Date.now() + _lockMs; _failCount = 0; }
            };
            _busy = true;
            App.auth.login(usernameInput, passwordInput, USERS).then(function (res) {
                if (!res.ok) { _busy = false; fail(res); return; }
                errorMsg.style.display = 'none';
                App.auth.start(res);
                App.store.pull().then(function () {}, function () {}).then(function () { window.location.replace('./branches.html'); });
            }, function () { _busy = false; fail(); });
        }
    </script>
</body>
</html>
