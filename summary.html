    <script>
        App.guardOwner('lblBtnSummary', './home.html');
        function applySavedTheme() {
            let savedTheme = App.store.get('rohan_theme_mode') || 'dark';
            let themeMeta = document.querySelector('meta[name="theme-color"]');

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#f3f4f6');
            } else {
                document.body.classList.remove('light-theme');
                if (themeMeta) themeMeta.setAttribute('content', '#080808');
            }
        }
        applySavedTheme();

        let activeBranchId = sessionStorage.getItem('active_branch_id') || 'branch_1';
        let activeBranchName = (sessionStorage.getItem('active_branch_name') || 'ڈرائی فروٹ ہاؤس').trim();

        let branchOverrides = App.readObject('rohan_branch_lang_overrides');
        let globalLang = App.store.get('rohan_global_lang') || 'ur';
        let activeBranchLang = sessionStorage.getItem('active_branch_lang') || branchOverrides[activeBranchId] || globalLang;
        let isEn = (activeBranchLang === 'en');

        document.getElementById('headerBranchName').innerText = activeBranchName;

        let masterSettings = App.loadSettings(activeBranchId);

        (function(){ var t = (window.APP_CONFIG && APP_CONFIG.PRINT_FOOTER_TEXT) || ''; if (!t) return; var st = document.createElement('style'); st.textContent = '@media print { @page { @bottom-left { content: "' + t.replace(/["\\\n\r]/g, ' ') + '"; font-size: 8.5px; font-weight: bold; color: #333333; } } }'; document.head.appendChild(st); })();

        let showPcs = !masterSettings.cols || masterSettings.cols.pcs.visible !== false;
        let pcsCustomName = (masterSettings.cols && masterSettings.cols.pcs && masterSettings.cols.pcs.name) ? masterSettings.cols.pcs.name : (isEn ? 'Carton' : 'کارٹن');
        let showWeight = !masterSettings.cols || masterSettings.cols.weight.visible !== false;
        let weightCustomName = (masterSettings.cols && masterSettings.cols.weight && masterSettings.cols.weight.name) ? masterSettings.cols.weight.name : (isEn ? 'Weight' : 'وزن');
        let amountCustomName = (masterSettings.cols && masterSettings.cols.amount && masterSettings.cols.amount.name) ? masterSettings.cols.amount.name : '';

        function applyBoxPlacement() {
            let totalsBox = document.getElementById('mainSummaryTotalsBox');
            let tablesContainer = document.getElementById('summaryTablesContainer');
            let filterPanel = document.getElementById('summaryFilterPanel');

            if (masterSettings.summaryBoxPos === 'top' || masterSettings.summaryBoxPos === 'under_tables') {
                if (filterPanel && totalsBox) {
                    filterPanel.insertAdjacentElement('afterend', totalsBox);
                }
            } else {
                let container = document.getElementById('mainSummaryContainer');
                if (container && totalsBox) {
                    container.appendChild(totalsBox);
                }
            }
        }
        applyBoxPlacement();

        if (isEn) {
            document.body.classList.add('lang-en');
            document.documentElement.lang = 'en';
            document.title = `Cash Summary - ${activeBranchName}`;

            document.getElementById('summaryMainTitle').innerText = 'Cash Summary';
            document.getElementById('btnPrintSummary').innerText = '🖨 Print';
            document.getElementById('btnBackHome').innerText = '🔙 Back';

            document.getElementById('lblSearch').innerText = '🔎 Search Customer';
            document.getElementById('summarySearchInput').placeholder = '🔍 Name / Acc # / Amount';
            document.getElementById('lblDateFilter').innerText = '📅 Search Date';

            document.getElementById('titleTableJama').innerText = '🟢 Credit Accounts (Jama)';
            document.getElementById('titleTableBnam').innerText = '🟠 Debit Accounts (Bnam)';

            document.getElementById('thCustJama').innerText = 'Customer Name';
            document.getElementById('thAccJama').innerText = 'Acc No.';
            document.getElementById('thAccBnam').innerText = 'Acc No.';
            document.getElementById('thAmtJama').innerText = amountCustomName || 'Credit Amount';

            document.getElementById('thCustBnam').innerText = 'Customer Name';
            document.getElementById('thAmtBnam').innerText = amountCustomName || 'Debit Amount';

            let actionText = App.ownerCan('editCustomer') ? 'Edit' : 'Contact';
            document.getElementById('thActionJama').innerText = actionText;
            document.getElementById('thActionBnam').innerText = actionText;

            document.getElementById('lblTotalJama').innerText = 'Total Credit';
            document.getElementById('lblNetCash').innerText = 'Net Cash';
            document.getElementById('lblTotalBnam').innerText = 'Total Debit';
        } else {
            document.body.classList.remove('lang-en');
            document.documentElement.lang = 'ur';
            document.title = `روکڑ سمری - ${activeBranchName}`;

            document.getElementById('summaryMainTitle').innerText = 'روکڑ سمری';

            if (amountCustomName) {
                document.getElementById('thAmtJama').innerText = `${amountCustomName} (جمع)`;
                document.getElementById('thAmtBnam').innerText = `${amountCustomName} (بنام)`;
            }

            let actionText = App.ownerCan('editCustomer') ? 'ترمیم' : 'رابطہ';
            document.getElementById('thActionJama').innerText = actionText;
            document.getElementById('thActionBnam').innerText = actionText;
        }

        let savedBranchesConfig = App.store.get('rohan_branches_custom_config_v2');
        if (savedBranchesConfig) {
            try {
                let branches = JSON.parse(savedBranchesConfig);
                let currentBranch = branches.find(b => b.id === activeBranchId);
                if (currentBranch && currentBranch.color1) {
                    let primaryColor = currentBranch.color1;
                    let container = document.getElementById('mainSummaryContainer');
                    container.style.borderColor = primaryColor;
                    container.style.boxShadow = `0 4px 18px ${primaryColor}35`;

                    let topH = document.getElementById('summaryTopHeader');
                    if (topH) topH.style.borderBottomColor = primaryColor;

                    let prBtn = document.getElementById('btnPrintSummary');
                    if (prBtn) prBtn.style.backgroundColor = primaryColor;

                    let searchInp = document.getElementById('summarySearchInput');
                    if (searchInp) {
                        searchInp.addEventListener('focus', function() { this.style.borderColor = primaryColor; });
                        searchInp.addEventListener('blur', function() { this.style.borderColor = '#333'; });
                    }
                }
            } catch(e){}
        }

        let savedDocTitle = document.title;

        function updatePrintMetaStamp() {
            let now = new Date();
            let d = String(now.getDate()).padStart(2, '0');
            let m = String(now.getMonth() + 1).padStart(2, '0');
            let y = now.getFullYear();

            let hours = now.getHours();
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let ampm = isEn ? (hours >= 12 ? 'PM' : 'AM') : (hours >= 12 ? 'شام' : 'صبح');
            hours = hours % 12 || 12;
            let timeStr = `${hours}:${minutes} ${ampm}`;

            let stampEl = document.getElementById('printMetaStamp');
            if (stampEl) {
                stampEl.innerHTML = isEn ? `Date: ${d}/${m}/${y}<br>Time: ${timeStr}` : `تاریخ: ${d}/${m}/${y}<br>وقت: ${timeStr}`;
            }
        }

        function triggerPrintWithMeta() {
            updatePrintMetaStamp();
            savedDocTitle = document.title;
            document.title = "";
            (window.App&&App.printNow?App.printNow({hide:'.btn,.btn-header,.btn-print,.btn-back,.bar,.noprint,.search-wrapper,.date-wrap,.date-wrapper,.top-actions'}):window.print());
            setTimeout(() => { document.title = savedDocTitle; }, 1000);
        }

        window.onbeforeprint = function() {
            updatePrintMetaStamp();
            savedDocTitle = document.title;
            document.title = "";
        };

        window.onafterprint = function() {
            document.title = savedDocTitle;
        };

        window.openCustomerWhatsApp = function(event, customerName) {
            event.stopPropagation();
            customerName = decodeURIComponent(customerName);
            let detailsKey = activeBranchId + '_customer_details';
            let customerDetails = App.readArray(detailsKey);

            let custInfo = null;
            for (let i = customerDetails.length - 1; i >= 0; i--) {
                if (customerDetails[i].name && customerDetails[i].name.toLowerCase() === customerName.toLowerCase()) {
                    custInfo = customerDetails[i];
                    break;
                }
            }

            let rawPhone = custInfo && custInfo.phone ? custInfo.phone.trim() : '';

            if (!rawPhone || rawPhone === '-' || rawPhone === '0') {
                alert(isEn ? `⚠️ Mobile number not saved for "${customerName}"!` : `⚠️ گاہک "${customerName}" کا موبائل نمبر محفوظ نہیں ہے!`);
                return;
            }

            let cleanPhone = App.normalizePhone(rawPhone);

            let sendKhataConfirm = isEn
                ? `Do you want to share balance of "${customerName}" to WhatsApp?\n\n[OK] = Share Balance\n[Cancel] = Open WhatsApp Chat Only`
                : `کیا آپ "${customerName}" کا بیلنس واٹس ایپ پر شیئر کرنا چاہتے ہیں؟\n\n[OK] = بیلنس شیئر کریں\n[Cancel] = صرف واٹس ایپ کھولیں`;

            let shouldIncludeKhata = confirm(sendKhataConfirm);

            let message = "";
            if (shouldIncludeKhata) {
                let bnamRecordsKey = activeBranchId + '_bnam_records';
                let bnamRecords = App.readArray(bnamRecordsKey);
                let custRecords = bnamRecords.filter(r => r.customerName && r.customerName.toLowerCase() === customerName.toLowerCase());

                let totalJamaAmt = 0;
                let totalBnamAmt = 0;

                custRecords.forEach(r => {
                    let amt = parseFloat(r.totalAmount) || 0;
                    if (r.type === 'JAMA') {
                        totalJamaAmt += amt;
                    } else {
                        totalBnamAmt += amt;
                    }
                });

                let netBal = totalJamaAmt - totalBnamAmt;
                let balLine = "";

                if (netBal >= 0) {
                    balLine = `ٹوٹل جمع = ${Math.abs(netBal).toLocaleString('en-US')}`;
                } else {
                    balLine = `ٹوٹل بنام = ${Math.abs(netBal).toLocaleString('en-US')}`;
                }

                if (isEn) {
                    balLine = netBal >= 0 ? `Total Credit = ${Math.abs(netBal).toLocaleString('en-US')}` : `Total Debit = ${Math.abs(netBal).toLocaleString('en-US')}`;
                    message = `Dear ${customerName}, kindly check your account 🥀\n` +
                              `${activeBranchName}\n` +
                              `${balLine}`;
                } else {
                    message = `محترم ${customerName} صاحب برائے مہربانی اپنا کھاتہ چیک کرو 🥀\n` +
                              `${activeBranchName}\n` +
                              `${balLine}`;
                }
            }

            let waUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}`;
            if (message) {
                waUrl += `&text=${encodeURIComponent(message)}`;
            }

            App.openExternal(waUrl);
        };

        function loadSummaryData() {
            let customerKey = activeBranchId + '_customer_list';
            let detailsKey = activeBranchId + '_customer_details';
            let bnamRecordsKey = activeBranchId + '_bnam_records';

            let customers = App.readArray(customerKey).slice();
            let customerDetails = App.readArray(detailsKey);
            let bnamRecords = App.readArray(bnamRecordsKey);

            let selectedDate = document.getElementById('summaryDateFilter').value;

            let deletedShown = {};
            if (selectedDate) {
                App.readArray(activeBranchId + '_deleted_customers').forEach(d => {
                    let nm = (d && typeof d === 'object') ? d.name : d;
                    let iso = (d && typeof d === 'object') ? App.toISODate(d.date) : '';
                    if (nm && iso && selectedDate <= iso && !customers.some(c => App.sameName(c, nm))) {
                        customers.push(nm);
                        deletedShown[App.norm(nm)] = true;
                    }
                });
            }

            let _sets = App.loadSettings(activeBranchId);
            if (_sets.summarySort === 'name') customers.sort((a, b) => String(a).localeCompare(String(b)));
            else if (_sets.summarySort === 'added_desc') customers.reverse();

            let recsByName = {};
            let _idMap = {};
            App.readArray(activeBranchId + '_customer_details').forEach(c => { if (c && c.id && c.name) _idMap[c.id] = c.name; });
            bnamRecords.forEach(r => {
                if (!r) return;
                let n = App.norm((r.customerId && _idMap[r.customerId]) ? _idMap[r.customerId] : r.customerName);
                (recsByName[n] = recsByName[n] || []).push(r);
            });

            const jamaTbody = document.getElementById('jama_tbody');
            const bnamTbody = document.getElementById('bnam_tbody');

            jamaTbody.innerHTML = '';
            bnamTbody.innerHTML = '';

            let totalJamaAmount = 0, totalBnamAmount = 0;
            let jamaRowsCount = 0, bnamRowsCount = 0;

            if(customers.length === 0) {
                let noAccMsgJama = isEn ? 'No credit accounts exist!' : 'کوئی جمع کھاتہ موجود نہیں!';
                let noAccMsgBnam = isEn ? 'No debit accounts exist!' : 'کوئی بنام کھاتہ موجود نہیں!';
                jamaTbody.innerHTML = `<tr><td colspan="4" style="color:#999; padding: 15px;">${noAccMsgJama}</td></tr>`;
                bnamTbody.innerHTML = `<tr><td colspan="4" style="color:#999; padding: 15px;">${noAccMsgBnam}</td></tr>`;
                return;
            }

            customers.forEach(customerName => {
                let customerRecords = (recsByName[App.norm(customerName)] || []).slice();

                if (selectedDate) {
                    customerRecords = customerRecords.filter(record => record.date && record.date <= selectedDate);
                }

                let runningBalance = 0;
                let totalJamaPcs = 0, totalBnamPcs = 0;
                let totalJamaWeight = 0, totalBnamWeight = 0;

                customerRecords.forEach(record => {
                    let amt = parseFloat(record.totalAmount) || 0;
                    let pcs = parseFloat(record.pcs) || 0;
                    let wt = parseFloat(record.weight) || 0;

                    if (record.type === 'JAMA') {
                        runningBalance += amt;
                        totalJamaPcs += pcs;
                        totalJamaWeight += wt;
                    } else {
                        runningBalance -= amt;
                        totalBnamPcs += pcs;
                        totalBnamWeight += wt;
                    }
                });

                let netCartons = totalJamaPcs - totalBnamPcs;
                let netWeight = totalJamaWeight - totalBnamWeight;

                if ((selectedDate || _sets.hideZero) && runningBalance === 0 && netCartons === 0 && Math.abs(netWeight) < 0.001) {
                    return;
                }

                let custInfo = null;
                for (let i = customerDetails.length - 1; i >= 0; i--) {
                    if (customerDetails[i].name && customerDetails[i].name.toLowerCase() === customerName.toLowerCase()) {
                        custInfo = customerDetails[i];
                        break;
                    }
                }

                let accountNoText = custInfo && custInfo.accountNo ? custInfo.accountNo : '';

                let statsHtml = '';
                let hasCartons = (showPcs && netCartons !== 0);
                let hasWeight = (showWeight && Math.abs(netWeight) >= 0.001);

                if (hasCartons || hasWeight) {
                    let cartonPart = '';
                    if (hasCartons) {
                        let cColor = netCartons >= 0 ? 'color-jama' : 'color-bnam';
                        cartonPart = `<span class="stat-badge">${App.esc(pcsCustomName)}: <strong class="${cColor}">${Math.abs(netCartons)}</strong></span>`;
                    }

                    let weightPart = '';
                    if (hasWeight) {
                        let wColor = netWeight >= 0 ? 'color-jama' : 'color-bnam';
                        weightPart = `<span class="stat-badge">${App.esc(weightCustomName)}: <strong class="${wColor}">${Math.abs(netWeight).toFixed(2)}</strong></span>`;
                    }

                    statsHtml = `
                        <div class="customer-stats-subrow">
                            ${cartonPart}
                            ${weightPart}
                        </div>
                    `;
                }

                let tr = document.createElement('tr');
                tr.className = 'summary-row clickable-row';
                tr.setAttribute('data-customer-name', customerName.toLowerCase());
                tr.setAttribute('data-account-no', accountNoText.toString().toLowerCase());

                tr.addEventListener('click', function(e) {
                    if (e.target.closest('.btn-pen-tiny') || e.target.closest('.btn-wa-tiny')) return;
                    openLedger(customerName);
                });

                const officialWaIcon = `
                    <svg viewBox="0 0 48 48">
                        <rect width="48" height="48" rx="11" fill="#25D366"/>
                        <path fill="#FFFFFF" d="M24 10C16.3 10 10 16.3 10 24c0 2.7.8 5.2 2.2 7.4L10.5 38l6.8-1.7C19.4 37.4 21.6 38 24 38c7.7 0 14-6.3 14-14S31.7 10 24 10zm0 25.5c-2.1 0-4.1-.6-5.8-1.6l-.4-.2-4.3 1.1 1.2-4.2-.3-.5c-1.1-1.8-1.7-3.9-1.7-6.1 0-6.4 5.2-11.5 11.5-11.5s11.5 5.2 11.5 11.5-5.2 11.5-11.5 11.5zm6.3-8.6c-.3-.2-2-.9-2.3-1-.3-.1-.6-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-1-1.7-2-1.9-2.3-.2-.3 0-.5.2-.7.1-.1.3-.4.5-.6.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.2-.8-1.9-1.1-2.6-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1 0 1.8 1.3 3.6 1.5 3.8.2.3 2.6 4 6.3 5.6.9.4 1.6.6 2.1.8.9.3 1.7.2 2.3.1.7-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.1-.3-.2-.6-.4z"/>
                    </svg>
                `;

                let isDeletedRow = !!deletedShown[App.norm(customerName)];
                let actionBtnHtml = isDeletedRow ? '' : !App.ownerCan('editCustomer')
                    ? `<span class="btn-wa-tiny" onclick="openCustomerWhatsApp(event, '${encodeURIComponent(customerName).replace(/'/g, '%27')}')" title="${isEn ? 'Contact on WhatsApp' : 'واٹس ایپ پر رابطہ کریں'}">${officialWaIcon}</span>`
                    : `<span class="btn-pen-tiny" onclick="editCustomerName(event, '${encodeURIComponent(customerName).replace(/'/g, '%27')}')" title="${isEn ? 'Edit Info' : 'معلومات تبدیل کریں'}">✏️</span>`;

                let khataPrefix = isEn ? 'Account No.' : 'کھاتہ نمبر';
                let khataBadgeHtml = '';
                let accCellHtml = `<td class="acc-no-cell">${accountNoText ? App.esc(accountNoText) : '-'}</td>`;
                if (isDeletedRow) khataBadgeHtml += `<span class="khata-inline-badge">(${isEn ? 'Deleted' : 'ڈیلیٹ شدہ'})</span>`;

                try {
                    let _lim = App.creditLimitOf(activeBranchId, customerName, '');
                    if (_lim && runningBalance < 0 && -runningBalance > _lim) khataBadgeHtml += `<span class="limit-badge">💳 ${isEn ? 'Over limit' : 'حد سے زیادہ'}</span>`;
                } catch (e) {}

                if (runningBalance > 0) {
                    totalJamaAmount += runningBalance;
                    jamaRowsCount++;

                    tr.innerHTML = `
                        ${accCellHtml}
                        <td class="text-right">
                            <div class="customer-inline-info">
                                <div class="customer-name-row">
                                    <strong class="customer-main-name">${App.esc(customerName)}</strong>
                                    ${khataBadgeHtml}
                                </div>
                                ${statsHtml}
                            </div>
                        </td>
                        <td class="color-jama text-amount-jama main-amount-text">${runningBalance.toLocaleString('en-US')}</td>
                        <td class="col-action">${actionBtnHtml}</td>
                    `;
                    jamaTbody.appendChild(tr);
                }
                else if (runningBalance < 0) {
                    let finalAmount = Math.abs(runningBalance);
                    totalBnamAmount += finalAmount;
                    bnamRowsCount++;

                    tr.innerHTML = `
                        ${accCellHtml}
                        <td class="text-right">
                            <div class="customer-inline-info">
                                <div class="customer-name-row">
                                    <strong class="customer-main-name">${App.esc(customerName)}</strong>
                                    ${khataBadgeHtml}
                                </div>
                                ${statsHtml}
                            </div>
                        </td>
                        <td class="color-bnam text-amount-bnam main-amount-text">${finalAmount.toLocaleString('en-US')}</td>
                        <td class="col-action">${actionBtnHtml}</td>
                    `;
                    bnamTbody.appendChild(tr);
                }
                else {
                    if (netCartons < 0 || netWeight < 0) {
                        bnamRowsCount++;
                        tr.innerHTML = `
                            ${accCellHtml}
                            <td class="text-right">
                                <div class="customer-inline-info">
                                    <div class="customer-name-row">
                                        <strong class="customer-main-name">${App.esc(customerName)}</strong>
                                        ${khataBadgeHtml}
                                    </div>
                                    ${statsHtml}
                                </div>
                            </td>
                            <td class="color-bnam text-amount-bnam main-amount-text">0</td>
                            <td class="col-action">${actionBtnHtml}</td>
                        `;
                        bnamTbody.appendChild(tr);
                    } else {
                        jamaRowsCount++;
                        tr.innerHTML = `
                            ${accCellHtml}
                            <td class="text-right">
                                <div class="customer-inline-info">
                                    <div class="customer-name-row">
                                        <strong class="customer-main-name">${App.esc(customerName)}</strong>
                                        ${khataBadgeHtml}
                                    </div>
                                    ${statsHtml}
                                </div>
                            </td>
                            <td class="color-jama text-amount-jama main-amount-text">0</td>
                            <td class="col-action">${actionBtnHtml}</td>
                        `;
                        jamaTbody.appendChild(tr);
                    }
                }
            });

            let noRecordMsg = isEn ? 'No records found!' : 'کوئی ریکارڈ نہیں ملا!';
            if(jamaRowsCount === 0) jamaTbody.innerHTML = `<tr class="no-data-row"><td colspan="4" style="color:#999; padding: 15px;">${noRecordMsg}</td></tr>`;
            if(bnamRowsCount === 0) bnamTbody.innerHTML = `<tr class="no-data-row"><td colspan="4" style="color:#999; padding: 15px;">${noRecordMsg}</td></tr>`;

            let netCash = totalJamaAmount - totalBnamAmount;

            document.getElementById('total_jama_box').innerText = totalJamaAmount.toLocaleString('en-US');
            document.getElementById('total_bnam_box').innerText = totalBnamAmount.toLocaleString('en-US');

            let netCashEl = document.getElementById('net_cash');
            let formattedAbsNet = Math.abs(netCash).toLocaleString('en-US');

            if (netCash > 0) {
                netCashEl.className = 'color-jama';
                netCashEl.innerText = formattedAbsNet;
            } else if (netCash < 0) {
                netCashEl.className = 'color-bnam';
                netCashEl.innerText = formattedAbsNet;
            } else {
                netCashEl.className = 'color-cash';
                netCashEl.innerText = formattedAbsNet;
            }
        }

        window.openLedger = function(customerName) {
            sessionStorage.setItem('active_ledger_customer', customerName);
            sessionStorage.setItem('ledger_back_target', './summary.html');
            window.location.href = './customer_ledger.html';
        };

        window.editCustomerName = function(event, customerName) {
            event.stopPropagation();
            customerName = decodeURIComponent(customerName);
            if (!App.ownerCan('editCustomer')) {
                alert(isEn ? "⚠️ You are not authorized to edit customer details!" : "⚠️ آپ کے پاس گاہک کا نام تبدیل کرنے کی اجازت نہیں ہے!");
                return;
            }
            sessionStorage.setItem('active_ledger_customer', customerName);
            window.location.href = './edit_customer.html';
        };

        document.getElementById('summarySearchInput').addEventListener('input', function() {
            const filterValue = this.value.toLowerCase().trim();
            const summaryRows = document.querySelectorAll('#jama_tbody tr, #bnam_tbody tr');

            summaryRows.forEach(row => {
                if(row.classList.contains('no-data-row')) return;

                let nameMatch = row.getAttribute('data-customer-name')?.includes(filterValue);
                let accountMatch = row.getAttribute('data-account-no')?.includes(filterValue);
                let textMatch = row.innerText.toLowerCase().replace(/,/g, '').includes(filterValue);

                if (nameMatch || accountMatch || textMatch) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const st = App.loadSettings(activeBranchId);
            if (st.summaryToday) document.getElementById('summaryDateFilter').value = App.localDate();
            if (st.summarySubInfo === false) { const hide = document.createElement('style'); hide.textContent = '.customer-stats-subrow{display:none!important}'; document.head.appendChild(hide); }
            loadSummaryData();
        });
    </script>
<script>
/* mobile only: short account-number header so it stays on one line */
(function(){function f(){try{if(!window.matchMedia('(max-width:600px)').matches)return;var en=(sessionStorage.getItem('active_branch_lang')==='en');['thAccJama','thAccBnam'].forEach(function(i){var e=document.getElementById(i);if(e)e.textContent=en?'No.':'نمبر';});}catch(e){}}
f();window.addEventListener('load',f);})();
</script>
</body>
</html>
